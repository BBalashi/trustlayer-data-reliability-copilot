[project]
name = "trustlayer-data-reliability-copilot"
version = "0.1.0"
description = "A local DuckDB and Streamlit data-reliability MVP for Toronto transit data."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data", "outputs", "work"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ARG", "RUF"]
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
